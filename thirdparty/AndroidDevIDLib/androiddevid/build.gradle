// AndroidDevID library module. Produces androiddevid-<variant>.aar
// containing the Java entry point + a JNI .so per ABI.

plugins {
    id 'com.android.library'
}

android {
    namespace 'com.vlearn2.devid'
    // Mirrors flutter_app/android/app/build.gradle.kts
    // (`flutter.compileSdkVersion` → 35 on the current Flutter SDK).
    compileSdk 35

    defaultConfig {
        // Mirrors flutter_app/android/app/build.gradle.kts minSdk 24
        // — the Flutter app's plugin floor. Keep in lockstep.
        minSdk 24
        // Matches the Flutter app's targetSdk (35). targetSdk is
        // legal on a library module since AGP 8.x and AGP picks it
        // up when this .aar is consumed.
        targetSdk 35

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            // Mirrors flutter_app/android/app/build.gradle.kts
            // abiFilters. 32-bit slots were dropped per
            // todoList/list/05_post_process_android — Google Play
            // has required 64-bit since Aug 2019.
            abiFilters 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-fvisibility=hidden', '-O2', '-Wall', '-Wextra'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Library doesn't need R class / BuildConfig — keeps the .aar small
    // and avoids polluting consuming apps' resource namespace.
    buildFeatures {
        buildConfig false
    }
}
