// AndroidDevID library module. Produces androiddevid-<variant>.aar
// containing the Java entry point + a JNI .so per ABI.

plugins {
    id 'com.android.library'
}

android {
    namespace 'com.vlearn2.devid'
    compileSdk 34

    defaultConfig {
        // Matches the rest of the vLearn2 Flutter app — bump in
        // lockstep if/when the app moves up.
        minSdk 21

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            // ABIs the Flutter app currently ships. 32-bit ARM stays
            // until we drop legacy Android phones; the two x86
            // entries make emulator builds work out of the box.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-fvisibility=hidden', '-O2', '-Wall', '-Wextra'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Library doesn't need R class / BuildConfig — keeps the .aar small
    // and avoids polluting consuming apps' resource namespace.
    buildFeatures {
        buildConfig false
    }
}
