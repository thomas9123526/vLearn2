// AndroidDevIDLib — Java + JNI library that exposes
// AndroidDevID.getDeviceId(Context) as a stable per-device
// fingerprint. See README.md.

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'AndroidDevIDLib'
include ':androiddevid'
