plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.qrscanactivity'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 'api' so a consuming app inherits these on its classpath without
    // having to re-declare them when it pulls in scanner.aar via Maven.
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'com.google.android.material:material:1.12.0'

    def camerax_version = "1.3.4"
    api "androidx.camera:camera-core:${camerax_version}"
    api "androidx.camera:camera-camera2:${camerax_version}"
    api "androidx.camera:camera-lifecycle:${camerax_version}"
    api "androidx.camera:camera-view:${camerax_version}"

    // ZXing is vendored as source under src/main/java/com/google/zxing — no dep.
}
