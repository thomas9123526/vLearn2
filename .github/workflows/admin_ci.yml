name: Admin Panel CI

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'admin_panel/**'
      - '.github/workflows/admin_ci.yml'
  pull_request:
    paths:
      - 'admin_panel/**'

defaults:
  run:
    working-directory: admin_panel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin_panel/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
