<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FreeTalk — speak English with confidence</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  html[lang="zh"] { font-family: 'Plus Jakarta Sans', 'Noto Sans SC', system-ui, sans-serif; }
  html[lang="ko"] { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', system-ui, sans-serif; }
  html[lang="zh"] .ft-serif { font-family: 'Instrument Serif', 'Noto Serif SC', serif !important; }
  html[lang="ko"] .ft-serif { font-family: 'Instrument Serif', 'Noto Serif KR', serif !important; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  body { overscroll-behavior: none; }
  /* Smooth focus outlines off; we handle hover/active visually */
  button { font-family: inherit; }
  .ft-fade-in { animation: ft-fade-in .42s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes ft-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .ft-pop-in { animation: ft-pop-in .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes ft-pop-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  .ft-slide-up { animation: ft-slide-up .5s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes ft-slide-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes ft-pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes ft-orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes ft-wave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  @keyframes ft-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes ft-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes ft-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes ft-blink { 0%, 92%, 100% { transform: scaleY(1); } 95%, 98% { transform: scaleY(.1); } }
  @keyframes ft-mouth-talk { 0%, 100% { transform: scaleY(.4); } 25% { transform: scaleY(1.1); } 50% { transform: scaleY(.7); } 75% { transform: scaleY(1.2); } }
  @keyframes ft-mouth-open { 0%, 100% { transform: scaleY(.45) scaleX(.85); } 30% { transform: scaleY(1.4) scaleX(1.05); } 65% { transform: scaleY(.7) scaleX(.95); } }
  @keyframes ft-mouth-hm { 0%, 100% { transform: translateX(0) scaleX(1); } 50% { transform: translateX(2px) scaleX(.85); } }
  @keyframes ft-head-bob { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-1.5px) rotate(-.6deg); } 75% { transform: translateY(.5px) rotate(.4deg); } }
  @keyframes ft-head-tilt { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes ft-head-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  @keyframes ft-brow-lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes ft-splash-in { from { opacity: 0; transform: scale(.6) rotate(var(--r, 0deg)); } to { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); } }
  @keyframes ft-splash-bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(2deg); } }

  /* ── Face-to-face mode ───────────────────────────────────────────── */
  @keyframes ftf-body-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.012); } }
  @keyframes ftf-halo-pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes ftf-orb-drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(14px, -22px) scale(1.08); } }
  @keyframes ftf-bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-3deg); } }
  @keyframes ftf-wave-hand { 0%, 100% { transform: rotate(-12deg); } 25% { transform: rotate(18deg); } 50% { transform: rotate(-8deg); } 75% { transform: rotate(20deg); } }
  @keyframes ftf-rec { 0% { box-shadow: 0 0 0 0 currentColor; } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @keyframes ftf-caret { 50% { opacity: 0; } }
  @keyframes ftf-mode-fade { from { opacity: 0; } to { opacity: 1; } }

  /* ── Report screen animations ────────────────────────────────────── */
  @keyframes ft-confetti-fall {
    0% { transform: translate3d(0, -40px, 0) rotate(0deg); opacity: 0; }
    8% { opacity: 1; }
    100% { transform: translate3d(var(--dx, 0), 110vh, 0) rotate(var(--rz, 540deg)); opacity: 0; }
  }
  @keyframes ft-sparkle {
    0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1) rotate(180deg); opacity: 1; }
  }
  @keyframes ft-stamp-in {
    0% { opacity: 0; transform: scale(2.4) rotate(-25deg); }
    60% { opacity: 1; transform: scale(.92) rotate(-10deg); }
    80% { transform: scale(1.04) rotate(-7deg); }
    100% { opacity: 1; transform: scale(1) rotate(-8deg); }
  }
  @keyframes ft-bar-grow {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
  @keyframes ft-glow-breathe {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    50%      { filter: drop-shadow(0 0 18px var(--g, rgba(255,255,255,.5))); }
  }
  @keyframes ft-burst {
    0% { transform: scale(0); opacity: .9; }
    100% { transform: scale(3); opacity: 0; }
  }
  @keyframes ft-float-slow {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50%      { transform: translate(8px, -14px) rotate(8deg); }
  }
  @keyframes ft-tick-draw {
    from { stroke-dashoffset: 24; }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes ft-text-shimmer {
    0% { background-position: -120% 0; }
    100% { background-position: 220% 0; }
  }
  @keyframes ft-wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }
  @keyframes ft-ring-glow {
    0%, 100% { box-shadow: 0 0 0 0 var(--rg, rgba(255,255,255,0)); }
    50%      { box-shadow: 0 0 0 14px var(--rg, rgba(255,255,255,0)); }
  }
</style>
