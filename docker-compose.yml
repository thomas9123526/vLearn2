services:
  postgres:
    image: postgres:16-alpine
    container_name: vlearn2-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vlearn2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vlearn2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
