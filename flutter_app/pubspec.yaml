name: flutter_app
description: "vLearn2 — English learning with virtual tutor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.4.0

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Models / Serialization
  freezed_annotation: ^2.4.2
  json_annotation: ^4.9.0

  # Animation
  rive: ^0.13.13

  # i18n
  intl: ^0.20.2

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utilities
  logger: ^2.3.0
  collection: ^1.18.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

  # STT / TTS — uncomment after dropping a sherpa-onnx model bundle on the
  # device per todoList/0517_v2/01_stt_tts_sherpa_onnx.md §1.2. The Dart-level
  # services (SherpaOnnxSttService / SherpaOnnxTtsService) compile without
  # this package by guarding the native calls behind ModelRegistry checks.
  # sherpa_onnx: ^1.10.0
  # permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  drift_dev: ^2.18.0
  # retrofit_generator pinned in §03 once Retrofit clients are wired
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true   # enables l10n code generation from ARB files

  assets:
    - assets/config/
    - assets/guard/
    - assets/wordlists/
    - assets/images/
    - assets/animations/
    - assets/icons/

