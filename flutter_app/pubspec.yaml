name: flutter_app
description: "vLearn2 — English learning with virtual tutor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.4.0

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Models / Serialization
  freezed_annotation: ^2.4.2
  json_annotation: ^4.9.0

  # Animation. 0.14 was a major rewrite — RiveAnimation widget removed,
  # replaced by RiveWidget + a (Stateless)RiveWidgetController loaded
  # from File.asset(...). See features/conversation/widgets/tutor_avatar.dart.
  rive: ^0.14.7

  # i18n
  intl: ^0.20.2

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

  # Network reachability — Wi-Fi/mobile detection on Android, NLM
  # query on Windows. Used by NetworkStatusService and a Dio
  # interceptor that short-circuits requests when offline so the user
  # sees a single polite "no connection" banner instead of a long
  # Dio timeout.
  connectivity_plus: ^6.0.5

  # Pick a profile photo from camera or gallery. Used by the Edit
  # Profile dialog to upload an avatar to /users/avatar.
  image_picker: ^1.1.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utilities
  logger: ^2.3.0
  collection: ^1.18.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

  # DataManage `.ddp` unpacker — pure-Dart crypto. pointycastle ships
  # SHA-256, HKDF, AES-GCM, ECDH (`ECDHBasicAgreement`), and ECDSA.
  # archive ships zlib inflate. asn1lib parses the embedded X.509
  # admin cert (DER) and the pinned root CA cert (PEM). No FFI, no
  # native plugin — the .ddp pipeline runs entirely in Dart.
  pointycastle: ^3.9.1
  archive: ^3.6.1
  asn1lib: ^1.6.0

  # STT / TTS — see todoList/0517_v2/01_stt_tts_sherpa_onnx.md.
  # `sherpa_onnx` ships the ONNX runtime + recognizer/tts FFI. Native code is
  # guarded behind ModelRegistry.isReady() so the app still boots without a
  # model bundle on disk — the user just lands on ModelsNotInstalledScreen
  # and can continue in text-only mode.
  sherpa_onnx: ^1.13.0
  permission_handler: ^11.3.1
  # Mic capture. `record` is the official Flutter Community recorder; it
  # streams 16-bit PCM at the rate we ask for, which feeds straight into
  # sherpa-onnx without an extra resample. The 5.x record_linux fork has a
  # bug where its `hasPermission` signature drifted from the platform
  # interface; 6.x ships a fixed record_linux 1.x so we pin there.
  record: ^6.0.0
  # WAV playback for synthesized TTS clips. `audioplayers` is the most
  # widely-used cross-platform option and already a transitive dep.
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  drift_dev: ^2.18.0
  # retrofit_generator pinned in §03 once Retrofit clients are wired
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  # Native-side splash. Generates launch_background drawables (per density,
  # per light/dark) and the Android-12+ SplashScreen API attributes from the
  # `flutter_native_splash:` block below. Run `dart run
  # flutter_native_splash:create` after editing the config; it rewrites the
  # Android/iOS splash assets in place.
  flutter_native_splash: ^2.4.4

# Native-side splash configuration. Run `dart run
# flutter_native_splash:create` after changing anything here to regenerate
# the Android/iOS splash assets.
#
# Strategy: color-only for now. We pick the surface colors that match the
# Flutter splash background so the user sees a clean fill instantly on
# cold start instead of the white-flash on dark mode that the default
# `drawable/launch_background.xml` produced. No image yet — the wordmark +
# monogram still live in the Flutter splash, but the surrounding color
# matches across the engine-boot handoff so the seam is invisible.
#
# To add a centered monogram later: export the badge as a 384×384 PNG and
# add `image:` (light) / `image_dark:` (dark) + `android_12.image`. The
# generator will place it in the right density folders.
flutter_native_splash:
  # Light surface = #FFFFFF (sunrise / mint / lavender themes all use it).
  color: "#FFFFFF"
  # Dark surface = #1E1C2E (midnight theme).
  color_dark: "#1E1C2E"
  # Android-12+ uses the system SplashScreen API. Keep the same colors so
  # the OS-mandated splash matches the Flutter splash that follows.
  android_12:
    color: "#FFFFFF"
    color_dark: "#1E1C2E"
  # Only generating Android + iOS — skip web/desktop where boot is instant.
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true   # enables l10n code generation from ARB files

  assets:
    - assets/config/
    - assets/guard/
    - assets/wordlists/
    - assets/images/
    - assets/animations/
    - assets/animations/emoticon_linear/
    - assets/seed/scenarios.json
    - assets/seed/categories.json
    - assets/icons/
    # DataManage trust anchors. `root_ca.crt` (public) is committed
    # and pinned for cert-chain validation. `admin.key` (private) is
    # gitignored — each build deploy copies the right one in.
    - assets/datamanage/

  # Bundled font groups (Task 05 — todoList/0517_v2/05_font_groups.md).
  # Each typeface is a *variable* TTF — one file per family carrying the full
  # weight axis. Flutter resolves `fontWeight: FontWeight.w700` etc. against
  # the axis automatically, so we don't need separate Regular/Bold assets.
  # All files come from github.com/google/fonts under OFL 1.1.
  fonts:
    # Editorial — magazine vibe: serif headings + clean sans body
    - family: EditorialHeading
      fonts:
        - asset: assets/fonts/editorial/Lora.ttf
    - family: EditorialBody
      fonts:
        - asset: assets/fonts/editorial/Inter.ttf
    - family: EditorialMono
      fonts:
        - asset: assets/fonts/editorial/JetBrainsMono.ttf
    # Modern — geometric sans throughout
    - family: ModernHeading
      fonts:
        - asset: assets/fonts/modern/Inter.ttf
    - family: ModernBody
      fonts:
        - asset: assets/fonts/modern/Inter.ttf
    - family: ModernMono
      fonts:
        - asset: assets/fonts/modern/JetBrainsMono.ttf
    # Friendly — soft rounded sans
    - family: FriendlyHeading
      fonts:
        - asset: assets/fonts/friendly/Quicksand.ttf
    - family: FriendlyBody
      fonts:
        - asset: assets/fonts/friendly/Nunito.ttf
    - family: FriendlyMono
      fonts:
        - asset: assets/fonts/friendly/JetBrainsMono.ttf
    # Classic — traditional book-style serif
    - family: ClassicHeading
      fonts:
        - asset: assets/fonts/classic/PlayfairDisplay.ttf
    - family: ClassicBody
      fonts:
        - asset: assets/fonts/classic/SourceSerif4.ttf
    - family: ClassicMono
      fonts:
        - asset: assets/fonts/classic/JetBrainsMono.ttf
