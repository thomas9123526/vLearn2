# ASProxy64.dll (AhnLab) crashes Java 21's WEPoll-based I/O selector.
# Force the legacy Windows selector to avoid the injection crash.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider
android.useAndroidX=true
# Offline mode is enforced by the init script at
# %GRADLE_USER_HOME%\init.d\offline.init.gradle (installed by
# cmds\bootstrap_offline_gradle.bat). Set VLEARN2_ONLINE=1 to opt out.
