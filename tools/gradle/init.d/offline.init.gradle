// vLearn2 — Gradle init script: force offline by default.
//
// This file is copied into %GRADLE_USER_HOME%\init.d\ by
// cmds\bootstrap_offline_gradle.bat. Gradle auto-applies every *.gradle
// in init.d/ at the start of each build, including builds invoked
// internally by Flutter (`flutter build apk`, `flutter run`).
//
// Effect:
//   Default            → gradle.startParameter.offline = true
//                        (uses only C:\.gradle\caches\, no network)
//   VLEARN2_ONLINE=1   → no-op; gradle uses its normal online mode
//
// Workflow for adding new dependencies:
//   set VLEARN2_ONLINE=1
//   ... edit pubspec.yaml / build.gradle.kts ...
//   flutter pub get          (or gradlew :app:dependencies, etc.)
//   set VLEARN2_ONLINE=
//   cmds\verify_offline_build.bat   ← confirms the new dep resolves offline
//
// The env var is checked once at gradle invocation time, not per-task,
// so changing it in the middle of a build has no effect — start a fresh
// shell after toggling.

if (System.getenv("VLEARN2_ONLINE") != "1") {
    gradle.startParameter.offline = true
}
