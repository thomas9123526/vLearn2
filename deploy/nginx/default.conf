# Virtual Foreign Language System — Nginx reverse proxy
# Proxy all traffic to the NestJS backend.
# SSL termination: place your cert/key at nginx/certs/cert.pem and key.pem,
# then uncomment the HTTPS server block and set your domain in server_name.

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Frame-Options        DENY        always;
    add_header X-Content-Type-Options nosniff     always;
    add_header Referrer-Policy        no-referrer always;

    # --- Increase body limit for file uploads ---
    client_max_body_size 20M;

    # --- Proxy to backend ---
    location / {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

