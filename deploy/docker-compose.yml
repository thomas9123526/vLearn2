services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vlfls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vlfls]

  # ── AI Mock Server ──────────────────────────────────────────────────────────
  ai-mock:
    build:
      context: ../ai_model_mock
      dockerfile: Dockerfile
    container_name: vlfls-ai-mock
    restart: unless-stopped
    environment:
      PORT:               8081
      MOCK_MODEL_NAME:    ${MOCK_MODEL_NAME:-Qwen3.5-9B-mock}
      ANTHROPIC_API_KEY:  ${MOCK_ANTHROPIC_API_KEY:-}
      LOG_BODIES:         "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [vlfls]

  # ── NestJS Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vlfls-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-mock:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks: [vlfls]

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: vlfls-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [vlfls]

networks:
  vlfls:
    driver: bridge

volumes:
  pg_data:
  uploads:
